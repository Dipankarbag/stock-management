    <script>
        let currentUser = null;
        let activeIssuedItemId = null;
        let activeReceivedItemId = null;
        let currentFilteredLedger = [];

        const securityPassword = "admin123";

        let usersList = [
            { id: "USR-001", name: "System Admin", email: "dipankardag1987@gmail.com", password: "123", dept: "IT & Admin", phone: "+91 9876543210", role: "ADMIN", status: "ACTIVE" },
            { id: "USR-002", name: "Rahul Sharma", email: "rahul@company.com", password: "123", dept: "Operations", phone: "+91 9123456789", role: "USER", status: "ACTIVE" }
        ];

        let inventory = [
            { id: "1", name: "A4 Paper Rim", category: "Stationery", opening: 150, received: 10, issued: 30, current: 130, lastDate: "2026-10-05" },
            { id: "2", name: "Ball Pens Box", category: "Stationery", opening: 20, received: 5, issued: 10, current: 15, lastDate: "2026-10-08" },

            { id: "ORD-102", user: "Rahul Sharma", issuer: "System Admin", itemId: "2", itemName: "Ball Pens Box", category: "Stationery", qty: 5, time: "2026-10-08 11:15 AM", dateOnly: "2026-10-08", status: "ISSUED" }

        ];

        let logs = [{ time: new Date().toLocaleTimeString(), user: "System", action: "App Initialized" }];

        function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            errorDiv.classList.add('hidden');

            fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: emailInput, password: passwordInput })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.user.status !== 'ACTIVE') {
                        alert("Your account is disabled by Admin!");
                        return;
                    }
                    currentUser = data.user;
                    setupDashboardAfterLogin();
                } else {
                    localLoginFallback(emailInput, passwordInput, errorDiv);
                }
            })
            .catch(err => {
                console.log('Using local fallback login check');
                localLoginFallback(emailInput, passwordInput, errorDiv);
            });
        }

        function localLoginFallback(emailInput, passwordInput, errorDiv) {
            const matchedUser = usersList.find(u => 
                (u.email.toLowerCase() === emailInput.toLowerCase() || u.name.toLowerCase() === emailInput.toLowerCase()) && 
                u.password === passwordInput
            );

            if (matchedUser) {
                if (matchedUser.status !== 'ACTIVE') {
                    alert("Your account is disabled by Admin!");
                    return;
                }
                currentUser = matchedUser;
                setupDashboardAfterLogin();
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function setupDashboardAfterLogin() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('displayUserName').innerText = currentUser.name;
            document.getElementById('displayUserRole').innerText = currentUser.role;

            const switcher = document.getElementById('panelSwitcherContainer');
            if (currentUser.role === 'ADMIN') {
                switcher.classList.remove('hidden');
                populateUserDropdown();
                populateCategoriesDropdown();
                switchPanel('admin');
            } else {
                switcher.classList.add('hidden');
                switchPanel('user');
            }
            populateUserItemDropdown();
            renderAll();
        }

        function toggleAuthMode(mode) {
            if (mode === 'register') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            } else {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const dept = document.getElementById('regDept').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const newUser = {
                userId: "USR-00" + (usersList.length + 1),
                name, email, password, dept, phone, role: "USER", status: "ACTIVE"
            };

            fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            })
            .then(res => res.json())
            .then(data => {
                alert("Registration successful & saved to database! You can now login with: " + email);
                return fetch('/api/state');
            })
            .then(res => res.json())
            .then(data => {
                if(data.users && data.users.length) {
                    usersList = data.users.map(u => ({ id: u.user_id, name: u.name, email: u.email, password: u.password, dept: u.dept, phone: u.phone, role: u.role, status: u.status }));
                }
                toggleAuthMode('login');
                document.getElementById('registerForm').reset();
            })
            .catch(err => {
                console.error(err);
                alert("Error registering user to database!");
            });
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }

        function switchPanel(panel) {
            if (panel === 'user') {
                document.getElementById('userPanel').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            } else {
                document.getElementById('userPanel').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            }
        }

        function switchAdminTab(tab) {
            ['requests', 'stock', 'userOrders', 'users', 'logs'].forEach(t => {
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
            });
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
        }

        function populateUserItemDropdown() {
            const select = document.getElementById('itemSelect');
            select.innerHTML = '<option value="" disabled selected>-- Choose Item --</option>';
            inventory.forEach(i => {
                select.innerHTML += `<option value="${i.id}">${i.name} (${i.category})</option>`;
            });
        }

        function updateStockPreview() {
            const itemId = document.getElementById('itemSelect').value;
            const item = inventory.find(i => i.id === itemId);
            const badge = document.getElementById('stockBadge');
            document.getElementById('stockBadgeContainer').classList.remove('hidden');

            if (item && item.current > 0) {
                badge.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-green-100 text-green-800";
                badge.innerText = `Available (${item.current} Units)`;
            } else {
                badge.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-red-100 text-red-800";
                badge.innerText = "Out of Stock";
            }
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            const itemId = document.getElementById('itemSelect').value;
            const qty = parseInt(document.getElementById('orderQty').value);
            const item = inventory.find(i => i.id === itemId);

            if (!item || qty > item.current) {
                alert("Stock insufficient!");
                return;
            }

            const newOrderData = {
                orderId: "ORD-" + Math.floor(100 + Math.random() * 900),
                user: currentUser.name,
                itemId: item.id,
                itemName: item.name,
                category: item.category,
                qty: qty,
                timeStr: new Date().toLocaleTimeString(),
                dateOnly: new Date().toISOString().split('T')[0]
            };

            fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newOrderData)
            })
            .then(res => res.json())
            .then(data => {
                alert("Order Submitted & Saved to Database Successfully!");
                document.getElementById('orderForm').reset();
                document.getElementById('stockBadgeContainer').classList.add('hidden');
                return fetch('/api/state');
            })
            .then(res => res.json())
            .then(data => {
                if(data.orders && data.orders.length) {
                    orders = data.orders.map(o => ({ id: o.order_id, user: o.user_name, issuer: o.issuer_name, itemId: o.item_id, itemName: o.item_name, category: o.category, qty: o.qty, time: o.time_str, dateOnly: o.date_only ? o.date_only.split('T')[0] : '', status: o.status }));
                }
                renderAll();
            })
            .catch(err => {
                console.error(err);
                alert("Error saving order to database!");
            });
        }

        function processOrder(orderId, action) {
            const order = orders.find(o => o.id === orderId);
            const item = inventory.find(i => i.id === order.itemId);

            if (action === 'APPROVE') order.status = 'APPROVED';
            else if (action === 'ISSUE') {
                order.status = 'ISSUED';
                order.issuer = currentUser ? currentUser.name : "System Admin";
                item.issued += order.qty;
                item.current -= order.qty;
            } else if (action === 'REJECT') order.status = 'REJECTED';

            fetch('/api/orders/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    orderId: order.id,
                    action: action,
                    issuerName: currentUser ? currentUser.name : "System Admin"
                })
            }).catch(e => console.log('Server not reachable'));

            renderAll();
        }

        function populateCategoriesDropdown() {
            const select = document.getElementById('ledgerCategoryFilter');
            select.innerHTML = '<option value="ALL">-- All Categories --</option>';
            const cats = [...new Set(inventory.map(i => i.category))];
            cats.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function applyLedgerFilter() {
            const catVal = document.getElementById('ledgerCategoryFilter').value;
            const start = document.getElementById('ledgerStartDate').value;
            const end = document.getElementById('ledgerEndDate').value;

            const filtered = inventory.filter(i => {
                if(catVal !== 'ALL' && i.category !== catVal) return false;
                if(start && end && i.lastDate) {
                    if(i.lastDate < start || i.lastDate > end) return false;
                } else if(start && i.lastDate) {
                    if(i.lastDate < start) return false;
                }
                return true;
            });

            renderLedgerTableCustom(filtered);
        }

        function resetLedgerFilters() {
            document.getElementById('ledgerCategoryFilter').value = 'ALL';
            document.getElementById('ledgerStartDate').value = '';
            document.getElementById('ledgerEndDate').value = '';
            renderLedgerTableCustom(inventory);
        }

        function editOpeningQuantity(itemId) {
            const pwd = prompt("Security Access Required!\nPlease Enter Security Password to edit Opening Quantity:");
            if (pwd === null) return;
            
            if (pwd === securityPassword) {
                const item = inventory.find(i => i.id === itemId);
                const newOpeningStr = prompt(`Enter New Opening Quantity for '${item.name}':`, item.opening);
                const newOpening = parseInt(newOpeningStr);

                if (!isNaN(newOpening) && newOpening >= 0) {
                    item.opening = newOpening;
                    item.current = item.opening + item.received - item.issued;
                    
                    fetch('/api/inventory/update-opening', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ itemId: item.id, newOpening })
                    }).catch(e => console.log('Backend sync skipped'));

                    renderAll();
                    alert("Opening Quantity updated successfully!");
                } else if (newOpeningStr !== null) {
                    alert("Invalid Quantity entered!");
                }
            } else {
                alert("Incorrect Password! Access Denied.");
            }
        }

        // ADD-ON: Admin Item Delete Functionality
        function deleteInventoryItem(itemId) {
            if (confirm("Are you sure you want to delete this inventory item?")) {
                fetch(`/api/inventory/delete/${itemId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert("Item deleted successfully!");
                    inventory = inventory.filter(i => i.id !== itemId);
                    renderAll();
                })
                .catch(err => {
                    inventory = inventory.filter(i => i.id !== itemId);
                    renderAll();
                });
            }
        }

        // ADD-ON: Admin Order Delete Functionality
        function deleteOrderRecord(orderId) {
            if (confirm("Are you sure you want to delete this order record?")) {
                fetch(`/api/orders/delete/${orderId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert("Order deleted successfully!");
                    orders = orders.filter(o => o.id !== orderId);
                    renderAll();
                })
                .catch(err => {
                    orders = orders.filter(o => o.id !== orderId);
                    renderAll();
                });
            }
        }

        function renderLedgerTableCustom(list) {
            currentFilteredLedger = list;
            document.getElementById('adminStockTable').innerHTML = list.map(i => `
                <tr>
                    <td class="p-3 font-bold">${i.name}</td>
                    <td class="p-3 text-xs">${i.category}</td>
                    <td class="p-3 text-center">
                        <button onclick="editOpeningQuantity('${i.id}')" title="Click to edit Opening Quantity (Password Protected)" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold px-2.5 py-1 rounded border border-gray-300 text-xs">
                            ${i.opening} <i class="fa-solid fa-lock text-[10px] text-amber-600 ml-1"></i>
                        </button>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="showReceivedBreakdown('${i.id}')" title="Click to view received stock details" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1 rounded-full font-extrabold text-xs shadow border border-blue-300">
                            +${i.received} <i class="fa-solid fa-circle-info ml-1 text-[10px]"></i>
                        </button>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="showIssuedBreakdown('${i.id}')" title="Click to view issued user details" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1 rounded-full font-extrabold text-xs shadow border border-amber-300">
                            -${i.issued} <i class="fa-solid fa-circle-info ml-1 text-[10px]"></i>
                        </button>
                    </td>
                    <td class="p-3 text-center text-emerald-700 font-extrabold">${i.current}</td>
                    <td class="p-3 text-center text-xs text-gray-500">${i.lastDate || 'N/A'}</td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="openStockInModal('${i.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs font-bold shadow">+ Date Stock In</button>
                        <button onclick="editOpeningQuantity('${i.id}')" title="Edit Opening Stock" class="bg-amber-500 hover:bg-amber-600 text-white px-2 py-1 rounded text-xs font-bold shadow"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteInventoryItem('${i.id}')" title="Delete Item" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs font-bold shadow"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function exportLedgerCSV() {
            if(currentFilteredLedger.length === 0) { alert("No ledger data available to export!"); return; }
            let csv = "Inventory Movement Ledger Report\nItem Name,Category,Opening Stock,Received Stock,Issued Stock,Closing Balance,Last Received Date\n";
            currentFilteredLedger.forEach(i => { csv += `"${i.name}","${i.category}","${i.opening}","${i.received}","${i.issued}","${i.current}","${i.lastDate || 'N/A'}"\n`; });
            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = `Inventory_Movement_Ledger_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function printLedgerReport() {
            if(currentFilteredLedger.length === 0) { alert("No ledger data available to print!"); return; }
            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html><head><title>Inventory Movement Ledger Report</title>
                <style>body { font-family: Arial, sans-serif; padding: 20px; color: #333; } h2 { color: #0f172a; margin-bottom: 2px; } p { font-size: 13px; color: #64748b; margin-top: 0; } table { width: 100%; border-collapse: collapse; margin-top: 15px; } th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 13px; } th { background-color: #0f172a; color: white; } .text-center { text-align: center; } .font-bold { font-weight: bold; }</style>
                </head><body><h2>Inventory Movement Ledger Report</h2><p>Generated Date: ${new Date().toLocaleString()}</p><hr/><table><thead><tr><th>Item Name</th><th>Category</th><th class="text-center">Opening</th><th class="text-center">Received</th><th class="text-center">Issued</th><th class="text-center">Closing Balance</th><th class="text-center">Last Received Date</th></tr></thead><tbody>
                ${currentFilteredLedger.map(i => `<tr><td class="font-bold">${i.name}</td><td>${i.category}</td><td class="text-center">${i.opening}</td><td class="text-center">+${i.received}</td><td class="text-center">-${i.issued}</td><td class="text-center font-bold">${i.current}</td><td class="text-center">${i.lastDate || 'N/A'}</td></tr>`).join('')}
                </tbody></table></body></html>
            `);
            printWin.document.close(); printWin.focus(); setTimeout(() => { printWin.print(); }, 500);
        }

        function showReceivedBreakdown(itemId) {
            activeReceivedItemId = itemId;
            const item = inventory.find(i => i.id === itemId);
            document.getElementById('receivedItemTitle').innerText = `${item.name} (${item.category})`;
            
            const logsForNext = receivedLogs.filter(l => l.itemId === itemId);
            const tbody = document.getElementById('receivedDetailsTable');

            if(logsForNext.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">No stock in records found for this item yet.</td></tr>`;
            } else {
                tbody.innerHTML = logsForNext.map(l => `
                    <tr>
                        <td class="p-3 font-bold text-gray-800">${l.user}</td>
                        <td class="p-3 text-center font-bold text-blue-700 text-base">+${l.qty} Units</td>
                        <td class="p-3 text-xs text-gray-500">${l.dateOnly} (${l.time})</td>
                        <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs font-bold bg-blue-100 text-blue-800">RECEIVED</span></td>
                    </tr>
                `).join('');
            }

            document.getElementById('receivedDetailsModal').classList.remove('hidden');
        }

        function closeReceivedDetailsModal() {
            activeReceivedItemId = null;
            document.getElementById('receivedDetailsModal').classList.add('hidden');
        }

        function exportReceivedModalCSV() {
            if(!activeReceivedItemId) return;
            const item = inventory.find(i => i.id === activeReceivedItemId);
            const logsForNext = receivedLogs.filter(l => l.itemId === activeReceivedItemId);
            if(logsForNext.length === 0) { alert("No received stock records available to export!"); return; }

            let csv = `Stock Received Details Report - ${item.name} (${item.category})\nReceived By,Received Quantity,Date,Time,Status\n`;
            logsForNext.forEach(l => { csv += `"${l.user}","${l.qty}","${l.dateOnly}","${l.time}","RECEIVED"\n`; });

            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = `Received_Stock_Details_${item.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function printReceivedModalReport() {
            if(!activeReceivedItemId) return;
            const item = inventory.find(i => i.id === activeReceivedItemId);
            const logsForNext = receivedLogs.filter(l => l.itemId === activeReceivedItemId);

            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html><head><title>Received Stock Report - ${item.name}</title>
                <style>body { font-family: Arial, sans-serif; padding: 20px; color: #333; } h2 { color: #1e293b; margin-bottom: 2px; } p { font-size: 13px; color: #64748b; margin-top: 0; } table { width: 100%; border-collapse: collapse; margin-top: 15px; } th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 13px; } th { background-color: #0f172a; color: white; } .text-center { text-align: center; }</style>
                </head><body><h2>Stock Received Logs Breakdown Report</h2><p><strong>Item:</strong> ${item.name} | <strong>Category:</strong> ${item.category} | <strong>Generated:</strong> ${new Date().toLocaleString()}</p><hr/>
                <table><thead><tr><th>Received By (Receiver Name)</th><th class="text-center">Quantity Received</th><th>Date & Time</th><th class="text-center">Status</th></tr></thead><tbody>
                ${logsForNext.length === 0 ? `<tr><td colspan="4" class="text-center">No received records.</td></tr>` : logsForNext.map(l => `<tr><td>${l.user}</td><td class="text-center"><strong>+${l.qty} Units</strong></td><td>${l.dateOnly} (${l.time})</td><td class="text-center">RECEIVED</td></tr>`).join('')}
                </tbody></table></body></html>
            `);
            printWin.document.close(); printWin.focus(); setTimeout(() => { printWin.print(); }, 500);
        }

        function showIssuedBreakdown(itemId) {
            activeIssuedItemId = itemId;
            const item = inventory.find(i => i.id === itemId);
            document.getElementById('issuedItemTitle').innerText = `${item.name} (${item.category})`;
            
            const itemIssuedOrders = orders.filter(o => o.itemId === itemId && o.status === 'ISSUED');
            const tbody = document.getElementById('issuedDetailsTable');

            if(itemIssuedOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No issued records found for this item yet.</td></tr>`;
            } else {
                tbody.innerHTML = itemIssuedOrders.map(o => `
                    <tr>
                        <td class="p-3 font-bold text-gray-800">${o.user}</td>
                        <td class="p-3 font-bold text-blue-700">${o.issuer || 'System Admin'}</td>
                        <td class="p-3 text-center font-bold text-amber-700 text-base">${o.qty} Units</td>
                        <td class="p-3 text-xs text-gray-500">${o.dateOnly} (${o.time})</td>
                        <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-800">ISSUED</span></td>
                    </tr>
                `).join('');
            }

            document.getElementById('issuedDetailsModal').classList.remove('hidden');
        }

        function closeIssuedDetailsModal() { activeIssuedItemId = null; document.getElementById('issuedDetailsModal').classList.add('hidden'); }

        function exportIssuedModalCSV() {
            if(!activeIssuedItemId) return;
            const item = inventory.find(i => i.id === activeIssuedItemId);
            const itemIssuedOrders = orders.filter(o => o.itemId === activeIssuedItemId && o.status === 'ISSUED');
            if(itemIssuedOrders.length === 0) { alert("No issued records available to export!"); return; }

            let csv = `Issued Stock Details Report - ${item.name} (${item.category})\nIssued To (User),Issued By (Issuer Name),Issued Quantity,Date,Time,Status\n`;
            itemIssuedOrders.forEach(o => { csv += `"${o.user}","${o.issuer || 'System Admin'}","${o.qty}","${o.dateOnly}","${o.time}","${o.status}"\n`; });

            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = `Issued_Stock_Details_${item.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function printIssuedModalReport() {
            if(!activeIssuedItemId) return;
            const item = inventory.find(i => i.id === activeIssuedItemId);
            const itemIssuedOrders = orders.filter(o => o.itemId === activeIssuedItemId && o.status === 'ISSUED');

            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html><head><title>Issued Stock Report - ${item.name}</title>
                <style>body { font-family: Arial, sans-serif; padding: 20px; color: #333; } h2 { color: #1e293b; margin-bottom: 2px; } p { font-size: 13px; color: #64748b; margin-top: 0; } table { width: 100%; border-collapse: collapse; margin-top: 15px; } th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 13px; } th { background-color: #0f172a; color: white; } .text-center { text-align: center; }</style>
                </head><body><h2>Issued Stock Breakdown Report</h2><p><strong>Item:</strong> ${item.name} | <strong>Category:</strong> ${item.category} | <strong>Generated:</strong> ${new Date().toLocaleString()}</p><hr/>
                <table><thead><tr><th>Issued To (User)</th><th>Issued By (Issuer Name)</th><th class="text-center">Quantity Issued</th><th>Issue Date & Time</th><th class="text-center">Status</th></tr></thead><tbody>
                ${itemIssuedOrders.length === 0 ? `<tr><td colspan="5" class="text-center">No issued records.</td></tr>` : itemIssuedOrders.map(o => `<tr><td>${o.user}</td><td><strong>${o.issuer || 'System Admin'}</strong></td><td class="text-center"><strong>${o.qty} Units</strong></td><td>${o.dateOnly} (${o.time})</td><td class="text-center">${o.status}</td></tr>`).join('')}
                </tbody></table></body></html>
            `);
            printWin.document.close(); printWin.focus(); setTimeout(() => { printWin.print(); }, 500);
        }

        function openStockInModal(itemId) {
            const item = inventory.find(i => i.id === itemId);
            document.getElementById('stockInItemId').value = item.id;
            document.getElementById('stockInItemName').value = `${item.name} (${item.category})`;
            document.getElementById('stockInQty').value = '';
            document.getElementById('stockInDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('stockInReceiverName').value = currentUser ? currentUser.name : 'System Admin';
            document.getElementById('stockInModal').classList.remove('hidden');
        }

        function closeStockInModal() {
            document.getElementById('stockInModal').classList.add('hidden');
        }

        function saveStockInEntry() {
            const itemId = document.getElementById('stockInItemId').value;
            const qty = parseInt(document.getElementById('stockInQty').value);
            const dateStr = document.getElementById('stockInDate').value;
            const receiver = document.getElementById('stockInReceiverName').value.trim();

            if (!qty || qty <= 0 || !dateStr || !receiver) {
                alert("Please fill all required fields!");
                return;
            }

            const item = inventory.find(i => i.id === itemId);
            item.received += qty;
            item.current += qty;
            item.lastDate = dateStr;

            receivedLogs.unshift({
                itemId: item.id,
                user: receiver,
                qty: qty,
                dateOnly: dateStr,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            fetch('/api/inventory/stock-in', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ itemId, qty, dateStr, receiver })
            }).catch(e => console.log('Backend sync skipped'));

            closeStockInModal();
            renderAll();
            alert("Received Stock Log Added Successfully!");
        }

        function openAddItemModal() { document.getElementById('addItemModal').classList.remove('hidden'); }
        function closeAddItemModal() { document.getElementById('addItemModal').classList.add('hidden'); }

        function saveNewItem() {
            const name = document.getElementById('newItemName').value.trim();
            const category = document.getElementById('newItemCategory').value.trim();
            const opening = parseInt(document.getElementById('newItemOpening').value) || 0;

            if(!name || !category) { alert("Please enter item name & category!"); return; }

            const newItem = {
                id: (inventory.length + 1).toString(),
                name, category, opening, received: 0, issued: 0, current: opening, lastDate: new Date().toISOString().split('T')[0]
            };

            inventory.push(newItem);

            fetch('/api/inventory/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, category, opening })
            }).catch(e => console.log('Backend sync skipped'));

            closeAddItemModal();
            populateUserItemDropdown();
            populateCategoriesDropdown();
            renderAll();
            alert("New Item Added Successfully!");
        }

        function toggleUserStatus(userId) {
            const u = usersList.find(x => x.id === userId);
            if(u && u.role !== 'ADMIN') { u.status = u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE'; renderAll(); }
        }

        function deleteUserAccount(userId) {
            if(confirm("Are you sure you want to delete this user?")) { usersList = usersList.filter(x => x.id !== userId); renderAll(); }
        }

        function populateUserDropdown() {
            const select = document.getElementById('userFilterSelect');
            select.innerHTML = '<option value="ALL">-- All Users --</option>';
            usersList.forEach(u => { if(u.role !== 'ADMIN') select.innerHTML += `<option value="${u.name}">${u.name}</option>`; });
        }

        function applyUserHistoryFilter() {
            const selectedUser = document.getElementById('userFilterSelect').value;
            const start = document.getElementById('userOrderStartDate').value;
            const end = document.getElementById('userOrderEndDate').value;

            const filtered = orders.filter(o => {
                let matchUser = (selectedUser === 'ALL' || o.user === selectedUser);
                let matchDate = true;
                if(start && end) matchDate = (o.dateOnly >= start && o.dateOnly <= end);
                return matchUser && matchDate;
            });

            renderUserHistoryTableCustom(filtered);
        }

        function renderUserHistoryTableCustom(list) {
            document.getElementById('adminUserOrdersHistoryTable').innerHTML = list.map(o => `
                <tr>
                    <td class="p-3 text-blue-600">${o.id}</td>
                    <td class="p-3 font-bold">${o.user}</td>
                    <td class="p-3">${o.itemName}</td>
                    <td class="p-3 text-xs">${o.category}</td>
                    <td class="p-3 text-center font-bold">${o.qty}</td>
                    <td class="p-3 text-xs text-gray-400">${o.time}</td>
                    <td class="p-3 text-center space-x-1">
                        <span class="px-2 py-0.5 rounded text-xs font-bold bg-blue-100 text-blue-800">${o.status}</span>
                        <button onclick="deleteOrderRecord('${o.id}')" title="Delete Order" class="bg-red-600 hover:bg-red-700 text-white px-2 py-0.5 rounded text-xs font-bold ml-2 shadow"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function exportUserOrdersCSV() {
            let csv = "Order ID,User Name,Item Name,Category,Qty,Time,Status\n";
            orders.forEach(o => { csv += `"${o.id}","${o.user}","${o.itemName}","${o.category}","${o.qty}","${o.time}","${o.status}"\n`; });
            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = `User_Order_History.csv`;
            link.click();
        }

        function renderAll() {
            const userOrders = currentUser && currentUser.role === 'USER' ? orders.filter(o => o.user === currentUser.name) : orders;
            document.getElementById('userOrdersTable').innerHTML = userOrders.map(o => `
                <tr>
                    <td class="p-3 font-semibold text-blue-600">${o.id}</td>
                    <td class="p-3">${o.itemName}</td>
                    <td class="p-3 text-gray-500">${o.category}</td>
                    <td class="p-3 font-bold text-center">${o.qty}</td>
                    <td class="p-3 text-xs text-gray-400">${o.time}</td>
                    <td class="p-3 text-center"><span class="px-2 py-1 text-xs rounded-full font-bold bg-amber-100 text-amber-700">${o.status}</span></td>
                </tr>
            `).join('');

            const pending = orders.filter(o => o.status === 'UNDER PROCESS' || o.status === 'APPROVED');
            document.getElementById('pendingCount').innerText = pending.length;
            document.getElementById('adminRequestsTable').innerHTML = pending.map(o => `
                <tr>
                    <td class="p-3 font-semibold text-blue-600">${o.id}</td>
                    <td class="p-3 font-bold">${o.user}</td>
                    <td class="p-3">${o.itemName}</td>
                    <td class="p-3 text-center font-bold">${o.qty}</td>
                    <td class="p-3 text-center">Available</td>
                    <td class="p-3 text-center space-x-1">
                        ${o.status === 'UNDER PROCESS' ? `<button onclick="processOrder('${o.id}', 'APPROVE')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Approve</button>` : ''}
                        <button onclick="processOrder('${o.id}', 'ISSUE')" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Issue</button>
                        <button onclick="processOrder('${o.id}', 'REJECT')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Reject</button>
                    </td>
                </tr>
            `).join('');

            renderLedgerTableCustom(inventory);
            renderUserHistoryTableCustom(orders);

            document.getElementById('adminUsersTable').innerHTML = usersList.map(u => `
                <tr>
                    <td class="p-3 font-mono text-xs">${u.id}</td>
                    <td class="p-3 font-bold">${u.name}</td>
                    <td class="p-3 text-xs text-blue-600">${u.email}</td>
                    <td class="p-3 text-xs">${u.dept}</td>
                    <td class="p-3 text-xs">${u.phone}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-bold bg-purple-100 text-purple-800">${u.role}</span></td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-bold ${u.status === 'ACTIVE' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${u.status}</span></td>
                    <td class="p-3 text-center space-x-1">
                        ${u.role !== 'ADMIN' ? `
                            <button onclick="toggleUserStatus('${u.id}')" class="text-xs px-2 py-1 rounded ${u.status === 'ACTIVE' ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'} font-bold">${u.status === 'ACTIVE' ? 'Disable' : 'Enable'}</button>
                            <button onclick="deleteUserAccount('${u.id}')" class="text-xs px-2 py-1 rounded bg-red-100 text-red-700 font-bold">Delete</button>
                        ` : '<span class="text-xs text-gray-400">Admin Account</span>'}
                    </td>
                </tr>
            `).join('');

            document.getElementById('adminLogsTable').innerHTML = logs.map(l => `
                <tr>
                    <td class="p-3 text-xs text-gray-400">${l.time}</td>
                    <td class="p-3 text-xs font-bold text-gray-700">${l.user}</td>
                    <td class="p-3 text-xs text-gray-800">${l.action}</td>
                </tr>
            `).join('');
        }

        // Fetch state from backend database on load
        fetch('/api/state')
            .then(res => res.json())
            .then(data => {
                if(data.users && data.users.length) usersList = data.users.map(u => ({ id: u.user_id, name: u.name, email: u.email, password: u.password, dept: u.dept, phone: u.phone, role: u.role, status: u.status }));
                if(data.inventory && data.inventory.length) inventory = data.inventory.map(i => ({ id: i.item_id, name: i.name, category: i.category, opening: i.opening, received: i.received, issued: i.issued, current: i.current, lastDate: i.last_date ? i.last_date.split('T')[0] : '' }));
                if(data.orders && data.orders.length) orders = data.orders.map(o => ({ id: o.order_id, user: o.user_name, issuer: o.issuer_name, itemId: o.item_id, itemName: o.item_name, category: o.category, qty: o.qty, time: o.time_str, dateOnly: o.date_only ? o.date_only.split('T')[0] : '', status: o.status }));
                if(data.receivedLogs && data.receivedLogs.length) receivedLogs = data.receivedLogs.map(l => ({ itemId: l.item_id, user: l.receiver_name, qty: l.qty, dateOnly: l.date_only ? l.date_only.split('T')[0] : '', time: l.time_str }));
                renderAll();
            })
            .catch(e => {
                console.log('Using local fallback state');
                renderAll();
            });

        // AUTO-REFRESH BACKGROUND POLLING (Bina logout kiye live updates ke liye)
        setInterval(() => {
            if (currentUser) {
                fetch('/api/state')
                    .then(res => res.json())
                    .then(data => {
                        if(data.users && data.users.length) usersList = data.users.map(u => ({ id: u.user_id, name: u.name, email: u.email, password: u.password, dept: u.dept, phone: u.phone, role: u.role, status: u.status }));
                        if(data.inventory && data.inventory.length) inventory = data.inventory.map(i => ({ id: i.item_id, name: i.name, category: i.category, opening: i.opening, received: i.received, issued: i.issued, current: i.current, lastDate: i.last_date ? i.last_date.split('T')[0] : '' }));
                        if(data.orders && data.orders.length) orders = data.orders.map(o => ({ id: o.order_id, user: o.user_name, issuer: o.issuer_name, itemId: o.item_id, itemName: o.item_name, category: o.category, qty: o.qty, time: o.time_str, dateOnly: o.date_only ? o.date_only.split('T')[0] : '', status: o.status }));
                        if(data.receivedLogs && data.receivedLogs.length) receivedLogs = data.receivedLogs.map(l => ({ itemId: l.item_id, user: l.receiver_name, qty: l.qty, dateOnly: l.date_only ? l.date_only.split('T')[0] : '', time: l.time_str }));
                        renderAll();
                    })
                    .catch(e => console.log('Background sync skipped'));
            }
        }, 10000);
    </script>
